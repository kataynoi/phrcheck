# =============================================================================
#  ตัวอย่าง config สำหรับ nginx reverse proxy "ตัวหน้าสุด" ของเซิร์ฟเวอร์
#  (ไม่ใช่ไฟล์ที่ container นี้ใช้ — ให้ไปวางในไฟล์ config ของ nginx ตัวหน้า
#   แล้ว nginx -t && systemctl reload nginx)
#
#  ใช้กับ server block ของ https://mkho-mis.moph.go.th
# =============================================================================

location /phrcheck/ {
    # ---------------------------------------------------------------------
    # *** เครื่องหมาย / ท้าย proxy_pass สำคัญมาก ***
    # มี /  ท้าย  -> /phrcheck/login  ส่งถึงแอปเป็น /login   (ถูกต้อง)
    # ไม่มี /     -> /phrcheck/login  ส่งถึงแอปเป็น /phrcheck/login -> 404
    # ---------------------------------------------------------------------
    proxy_pass http://127.0.0.1:8087/;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    # ไฟล์ .xlsx ที่นำเข้าอาจมีหลายหมื่นแถว ต้องให้ใหญ่พอและรอได้นาน
    client_max_body_size 64M;
    proxy_read_timeout   300s;
    proxy_send_timeout   300s;
}
